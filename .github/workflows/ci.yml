name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild picks up security fixes of the Python base image.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt pytest
      - name: Run tests
        working-directory: app
        run: python -m pytest tests/ -q

  # Production image for the server, which pulls :latest on its own.
  # Only from main, and only after the tests passed.
  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/scellino/lexilogio:latest
            ghcr.io/scellino/lexilogio:${{ github.sha }}
